<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>总工作台 · All-in-One Console</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#040b15; --bg2:#071320; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.028);
  --line:rgba(148,190,235,.14); --line2:rgba(148,190,235,.28);
  --txt:#e8f2ff; --dim:#8ba6c4; --dim2:#5f7b98;
  --life:#a78bfa; --work:#2dd4bf;
  --warn:#fbbf24; --danger:#fb7185; --ok:#34d399;
  --r:16px;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); overflow-x:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
/* ---------- 背景光晕 ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30;animation:float 22s ease-in-out infinite}
.aurora i:nth-child(1){width:620px;height:620px;background:#1d4ed8;top:-220px;left:-140px}
.aurora i:nth-child(2){width:540px;height:540px;background:#0891b2;top:180px;right:-180px;animation-delay:-7s}
.aurora i:nth-child(3){width:520px;height:520px;background:#7c3aed;bottom:-220px;left:32%;animation-delay:-13s}
.aurora::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(120,170,220,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(120,170,220,.045) 1px,transparent 1px);
  background-size:52px 52px;mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 20%,transparent 78%)}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(36px,-28px) scale(1.08)}66%{transform:translate(-28px,26px) scale(.94)}}
.wrap{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 28px}

/* ---------- HERO ---------- */
header.hero{padding:44px 0 26px;position:relative;z-index:1}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#0ea5e9,#6366f1 55%,#a855f7);
  box-shadow:0 8px 30px rgba(56,189,248,.35),inset 0 1px 0 rgba(255,255,255,.35)}
h1{font-size:30px;font-weight:800;letter-spacing:.5px;line-height:1.15}
h1 em{font-style:normal;background:linear-gradient(90deg,#38bdf8,#a78bfa 45%,#f472b6);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-top:3px}
.sub b{color:var(--txt);font-weight:600}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock .t{font-size:26px;font-weight:700;letter-spacing:1px;color:#cfe6ff}
.clock .d{font-size:12px;color:var(--dim2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-top:26px}
.stat{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel2);backdrop-filter:blur(8px)}
.stat .v{font-size:23px;font-weight:800;letter-spacing:.5px}
.stat .k{font-size:11.5px;color:var(--dim2);margin-top:1px;letter-spacing:.4px}
.stat.c1 .v{color:var(--life)}.stat.c2 .v{color:var(--work)}.stat.c3 .v{color:#38bdf8}
.stat.c4 .v{color:var(--warn)}.stat.c5 .v{color:var(--ok)}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:26px 0 18px}
.search{position:relative;flex:1;min-width:280px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
.search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;color:var(--txt);font-size:14px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none;transition:.2s;font-family:inherit}
.search input:focus{border-color:rgba(56,189,248,.55);background:rgba(255,255,255,.075);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.search input::placeholder{color:var(--dim2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);cursor:pointer;font-size:13px;transition:.2s;font-family:inherit;white-space:nowrap}
.chip:hover{color:var(--txt);border-color:var(--line2)}
.chip.on{background:linear-gradient(135deg,rgba(56,189,248,.22),rgba(139,92,246,.22));
  border-color:rgba(56,189,248,.5);color:#fff;font-weight:600}
.chip .n{opacity:.6;font-size:11px;margin-left:4px}

/* ---------- 端口条 ---------- */
.ports{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px}
.pport{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;font-size:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim)}
.pport b{color:var(--txt);font-weight:600}
.pport .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.pport.clash{border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.1);color:#ffc4cd}
.pport.clash .dot{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.pport.none .dot{background:var(--dim2);box-shadow:none}

/* ---------- 卡片网格 ---------- */
.secttl{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:13px;color:var(--dim);letter-spacing:1px}
.secttl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.secttl span{width:8px;height:8px;border-radius:2px;transform:rotate(45deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.card{position:relative;border:1px solid var(--line);border-radius:var(--r);padding:20px;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .25s,box-shadow .25s;cursor:default}
.card:hover{transform:translateY(-4px);border-color:var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--ac),transparent 72%);opacity:.85}
.card::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-80px;top:-90px;
  background:var(--ac);opacity:.09;filter:blur(48px);pointer-events:none;transition:.3s}
.card:hover::after{opacity:.17}
.chead{display:flex;gap:13px;align-items:flex-start;position:relative;z-index:1}
.cico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,color-mix(in srgb,var(--ac) 30%,transparent),transparent);
  border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);color:var(--ac)}
.cico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cname{font-size:17px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.tagd{font-size:10.5px;padding:2px 7px;border-radius:5px;font-weight:600;letter-spacing:.4px;
  border:1px solid color-mix(in srgb,var(--dc) 45%,transparent);color:var(--dc);
  background:color-mix(in srgb,var(--dc) 12%,transparent)}
.cpath{font-size:11px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace;margin-top:2px}
.cdesc{color:var(--dim);font-size:12.5px;margin:12px 0 14px;min-height:38px;position:relative;z-index:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mets{display:flex;gap:7px;flex-wrap:wrap;position:relative;z-index:1;margin-bottom:14px}
.met{font-size:11px;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.055);
  border:1px solid var(--line);color:var(--dim)}
.met b{color:var(--txt);font-weight:600}
.met.git-clean b{color:var(--ok)} .met.git-dirty b{color:var(--warn)}
.cact{display:flex;gap:8px;position:relative;z-index:1;flex-wrap:wrap}
.btn{flex:1;min-width:88px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--txt);font-size:12.5px;transition:.18s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:rgba(255,255,255,.09)}
.btn.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 80%,transparent),color-mix(in srgb,var(--ac) 45%,transparent));
  border-color:transparent;color:#04121f;font-weight:700}
.btn.primary:hover{filter:brightness(1.12);box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn.icon{flex:none;min-width:38px;padding:9px 10px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.favd{color:var(--warn);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1)}
.hitmark{position:absolute;top:14px;right:14px;z-index:2;font-size:10.5px;padding:3px 8px;border-radius:6px;
  background:rgba(56,189,248,.16);border:1px solid rgba(56,189,248,.4);color:#7dd3fc;font-weight:600}

/* ---------- 空/尾 ---------- */
.empty{text-align:center;padding:70px 20px;color:var(--dim2);grid-column:1/-1}
.empty b{display:block;font-size:16px;color:var(--dim);margin-bottom:6px}
footer{margin:46px 0 34px;padding-top:20px;border-top:1px solid var(--line);
  color:var(--dim2);font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer code{color:var(--dim);font-family:ui-monospace,Consolas,monospace}

/* ---------- 抽屉 ---------- */
.mask{position:fixed;inset:0;z-index:50;background:rgba(2,8,16,.72);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,94vw);z-index:51;background:var(--bg2);
  border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;box-shadow:-24px 0 60px rgba(0,0,0,.5)}
.drawer.on{transform:translateX(0)}
.dhead{padding:20px 24px 16px;border-bottom:1px solid var(--line);position:relative}
.dhead::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ac)}
.dhrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.dtitle{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.dclose{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);cursor:pointer;display:grid;place-items:center;flex:none;transition:.2s}
.dclose:hover{color:var(--txt);border-color:var(--line2);background:rgba(255,255,255,.08)}
.dclose svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.dsearch{padding:14px 24px;border-bottom:1px solid var(--line)}
.dsearch input{width:100%;padding:10px 14px;border-radius:10px;color:var(--txt);font-size:13.5px;font-family:inherit;
  background:rgba(255,255,255,.05);border:1px solid var(--line);outline:none}
.dsearch input:focus{border-color:rgba(56,189,248,.5)}
.dbody{flex:1;overflow-y:auto;padding:8px 24px 30px;scroll-behavior:smooth}
.dbody::-webkit-scrollbar{width:8px}.dbody::-webkit-scrollbar-thumb{background:rgba(148,190,235,.2);border-radius:4px}
.grpttl{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--bg2) 70%,transparent);
  padding:16px 0 8px;font-size:12px;color:var(--dim);letter-spacing:1.2px;font-weight:700;
  display:flex;align-items:center;gap:8px}
.grpttl::after{content:"";flex:1;height:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;margin-bottom:6px;
  border:1px solid transparent;background:rgba(255,255,255,.035);transition:.16s}
.item:hover{border-color:var(--line2);background:rgba(255,255,255,.07);transform:translateX(3px)}
.iico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.22);color:#7dd3fc}
.iico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.imain{flex:1;min-width:0}
.iname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ipath{font-size:11px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.isub{font-size:10.5px;color:var(--dim2);margin-top:2px}
.item .act{display:flex;gap:6px;flex:none}
.mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--dim);cursor:pointer;display:grid;place-items:center;transition:.18s}
.mini:hover{color:var(--txt);border-color:var(--line2);background:rgba(255,255,255,.09)}
.mini svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini.ok{color:var(--ok);border-color:rgba(52,211,153,.5)}
mark{background:rgba(56,189,248,.3);color:#fff;border-radius:3px;padding:0 2px}
.hide{display:none!important}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:99;
  padding:11px 20px;border-radius:11px;background:rgba(10,26,44,.95);border:1px solid var(--line2);
  color:var(--txt);font-size:13px;opacity:0;transition:.28s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .wrap{padding:0 16px}.grid{grid-template-columns:1fr}h1{font-size:23px}
  .stats{grid-template-columns:repeat(2,1fr)}.clock{text-align:left}
}
</style>
</head>

let tmr;
function toast(m){
  const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tmr); tmr=setTimeout(()=>t.classList.remove('on'),1900);
}
async function cp(text,msg){
  try{ await navigator.clipboard.writeText(text); toast(msg||'已复制路径'); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg||'已复制路径'); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}
function openIt(p,rel){
  const relpath = rel||'';
  let url;
  if(/^https?:\/\//i.test(p)) url=p;
  else if(p.startsWith('dir://')) url=fileUrl(p.slice(6),'');
  else url=pageUrl(p,relpath);
  if(/^file:/i.test(url) && location.protocol!=='file:'){
    // http(s) 页面里浏览器安全策略禁止打开 file:// 链接：转为本地路径复制兜底
    let nat=url.slice(7); if(nat.startsWith('/')) nat=nat.slice(1);
    try{ nat=decodeURIComponent(nat); }catch(e){}
    cp(nat.replace(/\//g,'\\'),'浏览器禁止 http 页面打开本地文件，路径已复制；建议双击 index.html（file://）打开本工作台');
  } else window.open(url,'_blank');
  const it = REC.find(x=>x.k===p+relpath);
  if(it){ it.t=Date.now(); } else { REC.unshift({k:p+relpath,n:arguments[2]||'',t:Date.now()}); REC=REC.slice(0,40); }
  jset(LS_REC,REC);
}

/* ---------- 时钟 ---------- */
function tick(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  document.getElementById('clk').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  const wk=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('cdt').textContent=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' 周'+wk;
}
setInterval(tick,1000); tick();

/* ---------- 全局统计 ---------- */
const ALL = DATA.filter(d=>d.exists);
const totalPage = ALL.reduce((s,d)=>s+(d.htmlTotal||0),0);
const totalEntry = ALL.reduce((s,d)=>s+d.entries.length,0);
const totalCommit = ALL.reduce((s,d)=>s+(d.git.commits||0),0);
const totalDirty = ALL.reduce((s,d)=>s+(d.git.dirty||0),0);
const lifeN = ALL.filter(d=>d.domain==='life').length, workN = ALL.filter(d=>d.domain==='work').length;

document.getElementById('sDom').textContent=ALL.length;
document.getElementById('sPage').textContent=totalPage;
document.getElementById('snap').textContent=DATA[0]&&DATA[0].generated||'--';
document.getElementById('cAll').textContent=ALL.length;
document.getElementById('cLife').textContent=lifeN;
document.getElementById('cWork').textContent=workN;

document.getElementById('stats').innerHTML=[
  ['c3',totalPage,'页面总数'],
  ['c1',lifeN,'生活域仓库'],
  ['c2',workN,'工作域仓库'],
  ['c5',totalCommit,'Git 提交'],
  ['c4',totalDirty,'未提交改动'],
  ['c3',totalEntry,'可直开入口']
].map(x=>'<div class="stat '+x[0]+'"><div class="v">'+x[1]+'</div><div class="k">'+x[2]+'</div></div>').join('');

/* ---------- 端口条 ---------- */
(function(){
  const used={};
  ALL.forEach(d=>{ (d.ports||[]).forEach(p=>{ (used[p]=used[p]||[]).push(d.key) }) });
  const html=ALL.map(d=>{
    const ps=d.ports||[];
    if(!ps.length) return '<div class="pport none"><span class="dot"></span><b>'+esc(d.label)+'</b> 无静态服务</div>';
    return ps.map(p=>{
      const clash=(used[p]||[]).length>1;
      return '<div class="pport'+(clash?' clash':'')+'" title="'+(used[p]||[]).join(' / ')+'">'+
        '<span class="dot"></span><b>'+esc(d.label)+'</b> :'+p+(clash?' ⚠ 端口冲突':'')+'</div>';
    }).join('');
  }).join('');
  document.getElementById('ports').innerHTML=html;
})();

/* ---------- 卡片渲染 ---------- */
let state={q:'',f:'all'};

function cardHTML(d){
  const q=state.q.trim();
  const isLife=d.domain==='life';
  const dc=isLife?'var(--life)':'var(--work)';
  const g=d.git||{};
  const dirty=g.dirty;
  const fav=FAV.includes(d.key);
  // 匹配数量
  let hits=0, sample='';
  if(q){
    d.entries.forEach(e=>{ if((e.name+(e.path||'')+(e.desc||'')+d.label).toLowerCase().indexOf(q.toLowerCase())>=0){
      hits++; if(!sample) sample=e.name; } });
  }
  if(q && !hits) return '';
  return '<article class="card" style="--ac:'+d.accent+';--dc:'+dc+'">'+
    (q&&hits?'<div class="hitmark">'+hits+' 处命中</div>':'')+
    '<div class="chead">'+
      '<div class="cico">'+svg(d.icon)+'</div>'+
      '<div style="min-width:0;flex:1">'+
        '<div class="cname">'+hl(d.label,q)+'<span class="tagd">'+d.domainName+'</span></div>'+
        '<div class="cpath">'+hl(d.root,q)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="cdesc">'+hl(d.desc,q)+'</div>'+
    '<div class="mets">'+
      '<span class="met">页面 <b>'+d.htmlTotal+'</b></span>'+
      '<span class="met">入口 <b>'+d.entries.length+'</b></span>'+
      (g.commits?'<span class="met">提交 <b>'+g.commits+'</b></span>':'')+
      '<span class="met '+(dirty?'git-dirty':'git-clean')+'">未提交 <b>'+(dirty==null?'-':dirty)+'</b></span>'+
      '<span class="met">更新 <b>'+esc(d.mtime||'-')+'</b></span>'+
    '</div>'+
    '<div class="cact">'+
      '<button class="btn primary" onclick="go(\''+d.key+'\')">'+svg('run')+'打开主入口</button>'+
      '<button class="btn" onclick="openDrawer(\''+d.key+'\')">'+svg('dir')+'全部 '+d.entries.length+'</button>'+
      '<button class="btn icon'+(fav?' favd':'')+'" onclick="toggleFav(event,\''+d.key+'\')" title="收藏">'+svg('star')+'</button>'+
      '<button class="btn icon" onclick="cp(\''+d.root.replace(/\\/g,'/')+'\')" title="复制根目录">'+svg('copy')+'</button>'+
    '</div>'+
  '</article>';
}

function render(){
  let list=ALL.filter(d=>{
    if(state.f==='life') return d.domain==='life';
    if(state.f==='work') return d.domain==='work';
    if(state.f==='fav') return FAV.includes(d.key);
    return true;
  });
  const groups=[{t:'生活域 · PERSONAL',k:'life',list:list.filter(d=>d.domain==='life')},
                {t:'工作行业 · INDUSTRY',k:'work',list:list.filter(d=>d.domain==='work')}];
  let out='';
  groups.forEach(g=>{
    if(!g.list.length) return;
    const cards=g.list.map(cardHTML).join('');
    if(!cards.replace(/\s/g,'')) return;
    out+='<div class="secttl"><span style="background:'+(g.k==='life'?'var(--life)':'var(--work)')+'"></span>'+g.t+'</div>'+
         '<div class="grid">'+cards+'</div>';
  });
  if(!out) out='<div class="empty"><b>没有匹配的项目</b>换个关键词试试，或者清空搜索框</div>';
  document.getElementById('main').innerHTML=out;
  document.getElementById('cFav').textContent=FAV.length;
}

function go(key){
  const d=ALL.find(x=>x.key===key); if(!d) return;
  openIt(d.root, d.main);
  toast('已打开：'+d.label);
}
function toggleFav(e,key){
  e.stopPropagation();
  const i=FAV.indexOf(key);
  if(i>=0){ FAV.splice(i,1); toast('已取消收藏'); } else { FAV.push(key); toast('已收藏'); }
  jset(LS_FAV,FAV); render();
}
window.go=go; window.toggleFav=toggleFav;

/* ---------- 抽屉 ---------- */
let curKey=null;
function openDrawer(key){
  const d=ALL.find(x=>x.key===key); if(!d) return;
  curKey=key;
  const drawer=document.getElementById('drawer');
  drawer.style.setProperty('--ac',d.accent);
  document.getElementById('dIco').innerHTML='<span style="display:grid;width:30px;height:30px;border-radius:9px;place-items:center;border:1px solid '+d.accent+'55;background:'+d.accent+'22;color:'+d.accent+';margin-right:-2px">'+svg(d.icon).replace('<svg','<svg style="width:18px;height:18px"')+'</span>';
  document.getElementById('dName').textContent=d.label;
  document.getElementById('dRoot').textContent=d.root;
  const g=d.git||{};
  document.getElementById('dMeta').innerHTML=
    '<span class="met">'+d.domainName+'</span>'+
    '<span class="met">页面 <b>'+d.htmlTotal+'</b></span>'+
    '<span class="met">入口 <b>'+d.entries.length+'</b></span>'+
    (g.branch?'<span class="met">分支 <b>'+esc(g.branch)+'</b></span>':'')+
    (g.commits?'<span class="met">提交 <b>'+g.commits+'</b></span>':'')+
    '<span class="met '+(g.dirty?'git-dirty':'git-clean')+'">未提交 <b>'+(g.dirty==null?'-':g.dirty)+'</b></span>'+
    (g.lastCommit?'<span class="met">最近提交 <b>'+esc(g.lastCommit)+'</b></span>':'')+
    (d.ports&&d.ports.length?'<span class="met">端口 <b>:'+d.ports.join(', :')+'</b></span>':'')+
    (d.mainDoc?'<a class="btn icon" target="_blank" href="'+pageUrl(d.root,d.mainDoc)+'" title="README">'+svg('file')+'</a>':'');
  document.getElementById('dq').value='';
  renderBody();
  document.getElementById('mask').classList.add('on');
  drawer.classList.add('on');
}
function closeDrawer(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function renderBody(){
  const d=ALL.find(x=>x.key===curKey); if(!d) return;
  const q=document.getElementById('dq').value.trim().toLowerCase();
  const gs={};
  (d.groups||[]).forEach(g=>{ gs[g.title]=[] });
  d.entries.forEach(e=>{ const t=e.group||'其他页面'; (gs[t]=gs[t]||[]).push(e) });
  let body='', n=0;
  Object.keys(gs).forEach(t=>{
    const items=gs[t].filter(e=>!q||((e.name+' '+(e.path||'')+' '+(e.desc||'')).toLowerCase().indexOf(q)>=0));
    if(!items.length) return;
    n+=items.length;
    body+='<div class="grpttl">'+esc(t)+' · '+items.length+'</div>';
    items.forEach(e=>{
      const target=String(e.path||'');
      const isDir=target.startsWith('dir://');
      const real=isDir?target.slice(6):target;
      const full=d.root.replace(/\\/g,'/')+'/'+real+(isDir?'/':'');
      const u=e.href||pageUrl(d.root,real);
      body+='<div class="item">'+
        '<div class="iico">'+svg(isDir?'dir':(e.icon||'file'))+'</div>'+
        '<div class="imain">'+
          '<div class="iname">'+hl(e.name,q)+(e.badge?' <span class="met" style="margin-left:6px">'+esc(e.badge)+'</span>':'')+'</div>'+
          '<div class="ipath">'+hl(full,q)+'</div>'+
          (e.desc?'<div class="isub">'+hl(e.desc,q)+'</div>':'')+
        '</div>'+
        '<div class="act">'+
          '<button class="mini" onclick=\'visit('+JSON.stringify(JSON.stringify(u))+
            ','+JSON.stringify(JSON.stringify(e.name))+','+JSON.stringify(JSON.stringify(full))+'\') title="打开">'+svg('ext')+'</button>'+
          '<button class="mini" onclick=\'cp('+JSON.stringify(JSON.stringify(full))+')\' title="复制路径">'+svg('copy')+'</button>'+
        '</div>'+
      '</div>';
    });
  });
  if(!n) body='<div class="empty"><b>项目内没有匹配项</b>清空过滤条件看看</div>';
  document.getElementById('dBody').innerHTML=body;
}
function visit(u,name,pathish){
  window.open(u,'_blank');
  REC.unshift({k:u,n:name,t:Date.now()}); REC=REC.slice(0,40); jset(LS_REC,REC);
}
window.visit=visit;

document.getElementById('dClose').onclick=closeDrawer;
document.getElementById('mask').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer() });
document.getElementById('dq').addEventListener('input',renderBody);
document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value; render() });
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  state.f=b.dataset.f;
  [].forEach.call(document.querySelectorAll('.chip'),c=>c.classList.toggle('on',c===b));
  render();
});
render();
</script>
</body>
